<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackFlow - PDF Organizer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="container">
                <h1 class="logo">
                    <span class="logo-icon">📄</span>
                    StackFlow
                </h1>
                <p class="tagline">Organize, arrange, and merge your PDF files effortlessly</p>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <!-- Upload Section -->
                <section class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-content">
                            <div class="upload-icon">📁</div>
                            <h2>Drop PDF files here</h2>
                            <p>or <button class="browse-btn" id="browseBtn">browse files</button></p>
                            <input type="file" id="fileInput" multiple accept=".pdf" style="display: none;">
                        </div>
                    </div>
                </section>

                <!-- PDF List Section -->
                <section class="pdf-list-section" id="pdfListSection" style="display: none;">
                    <div class="section-header">
                        <h2>Organize Your PDFs</h2>
                        <p>Drag and drop to reorder, then merge when ready</p>
                    </div>
                    
                    <div class="pdf-list" id="pdfList">
                        <!-- PDF items will be dynamically added here -->
                    </div>

                    <div class="actions">
                        <button class="btn btn-secondary" id="clearBtn">Clear All</button>
                        <button class="btn btn-primary" id="mergeBtn" disabled>
                            <span class="btn-icon">⚡</span>
                            Merge PDFs
                        </button>
                    </div>
                </section>

                <!-- Progress Section -->
                <section class="progress-section" id="progressSection" style="display: none;">
                    <div class="progress-content">
                        <div class="progress-icon">⏳</div>
                        <h3>Merging PDFs...</h3>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p class="progress-text" id="progressText">Initializing...</p>
                    </div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2025 StackFlow. A modern PDF organizer.</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
